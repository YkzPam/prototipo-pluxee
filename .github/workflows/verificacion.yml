name: Verificar y preparar prototipo
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python manage.py check --settings=config.settings.testing
      - run: python -m coverage run manage.py test --settings=config.settings.testing
      - run: python -m coverage report --fail-under=80
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py collectstatic --noinput
      - name: Preparar código revisable
        run: git archive --format=zip HEAD -o prototipo-pluxee.zip
      - uses: actions/upload-artifact@v4
        with:
          name: prototipo-pluxee
          path: prototipo-pluxee.zip
