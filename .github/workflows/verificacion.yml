name: Verificar y preparar prototipo
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Instalar bibliotecas del sistema (con reintentos)
        # Un repositorio de paquetes caído no debe fallar la verificación del prototipo.
        run: |
          for intento in 1 2 3; do
            sudo apt-get -o Acquire::Retries=3 update && \
              sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends pkg-config default-libmysqlclient-dev && exit 0
            echo "Intento $intento: el repositorio de paquetes no respondió; se reintenta en 20 segundos."
            sleep 20
          done
          exit 1
      - run: pip install -r requirements.txt
      - run: python manage.py check --settings=config.settings.testing
      - run: python -m coverage run manage.py test --settings=config.settings.testing
      - run: python -m coverage report --fail-under=80
      - run: python manage.py makemigrations --check --dry-run --settings=config.settings.testing
      - run: python manage.py collectstatic --noinput --settings=config.settings.testing
      - name: Preparar código revisable
        run: git archive --format=zip HEAD -o prototipo-pluxee.zip
      - uses: actions/upload-artifact@v4
        with:
          name: prototipo-pluxee
          path: prototipo-pluxee.zip
