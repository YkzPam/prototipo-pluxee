{% load moneda %}
<figure class="bar-chart">
  {% if chart.empty %}
  <p class="muted bar-chart-empty">{{ empty_text }}</p>
  {% else %}
  <svg viewBox="0 0 {{ chart.width }} {{ chart.height }}" role="img" aria-labelledby="{{ chart_id }}-title">
    <title id="{{ chart_id }}-title">{{ title }}</title>
    {% for tick in chart.y_ticks %}
    <line class="bar-chart-grid" x1="{{ chart.left }}" x2="{{ chart.right }}" y1="{{ tick.y }}" y2="{{ tick.y }}"/>
    <text class="bar-chart-axis" x="{{ chart.axis_x }}" y="{{ tick.y }}" text-anchor="end" dominant-baseline="middle">{{ tick.text }}</text>
    {% endfor %}
    {% for bar in chart.bars %}
    <rect class="bar-chart-bar {{ bar.css }}" x="{{ bar.x }}" y="{{ bar.y }}" width="{{ bar.w }}" height="{{ bar.h }}" rx="2"><title>{{ bar.title }}</title></rect>
    {% endfor %}
    {% for label in chart.x_labels %}
    <text class="bar-chart-axis" x="{{ label.x }}" y="{{ chart.label_y }}" text-anchor="middle">{{ label.text }}</text>
    {% endfor %}
  </svg>
  {% endif %}
  <figcaption class="bar-chart-legend">
    {% for name, css, total in chart.legend %}<span><i class="bar-chart-swatch {{ css }}" aria-hidden="true"></i>{{ name }}: <strong>{% if chart.money %}${% endif %}{{ total|clp }}</strong></span>{% endfor %}
  </figcaption>
</figure>
