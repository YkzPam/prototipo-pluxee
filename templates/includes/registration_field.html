<div class="field{% if wide %} registration-field-wide{% endif %}">
  {{ field.label_tag }}
  {{ field }}
  {% if field.help_text %}<small class="muted user-field-help" id="{{ field.auto_id }}_helptext">{{ field.help_text }}</small>{% endif %}
  {% if field.errors %}<div class="field-errors" role="alert">{{ field.errors }}</div>{% endif %}
</div>
